<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
        EY DWG Assistant | Geometry Quantity Engine
    </title>

    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="login-page">

    <div class="page-glow glow-one"></div>
    <div class="page-glow glow-two"></div>

    <main class="login-shell">

        <section class="login-card">

            <div class="brand-block">
                <div class="brand-mark">
                    EY
                </div>

                <div>
                    <p class="eyebrow">
                        Engineering Intelligence
                    </p>

                    <h1>
                        EY DWG Assistant
                    </h1>

                    <p style="margin-top:8px;color:#777;">
                        Universal Geometry Quantity Engine
                    </p>
                </div>
            </div>

            <form
                class="login-form"
                id="loginForm">

                <label class="field">
                    <span>
                        Username
                    </span>

                    <input
                        type="text"
                        placeholder="Enter your username"
                        required />
                </label>

                <label class="field">
                    <span>
                        Password
                    </span>

                    <div class="password-row">

                        <input
                            id="passwordInput"
                            type="password"
                            placeholder="Enter your password"
                            required />

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password">

                            Show

                        </button>

                    </div>
                </label>

                <label class="remember-row">
                    <input
                        type="checkbox"
                        checked />

                    <span>
                        Keep me signed in
                    </span>
                </label>

                <button
                    class="btn btn-primary"
                    type="submit">

                    Sign In

                </button>

            </form>

            <div class="login-footer">

                <a href="#">
                    Need help?
                </a>

                <a href="#">
                    Privacy policy
                </a>

            </div>

        </section>

    </main>

    <script src="../js/app.js"></script>

</body>
</html>
